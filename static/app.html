<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅程計劃</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Noto Sans TC","Hiragino Sans",sans-serif;background:#f7f4ef;color:#2b2b2b}
  #app{display:flex;flex-direction:column;height:100vh}
  header{padding:8px 14px 6px;background:#3e5c4b;color:#fff}
  header h1{margin:0;font-size:14.5px;font-weight:600}
  header p{margin:2px 0 0;font-size:10.5px;opacity:.85}
  #searchbar{padding:8px 10px;background:#dfe8e0;display:flex;gap:6px;align-items:center;border-bottom:2px solid #3e5c4b}
  #q{flex:1;padding:10px 12px;font-size:14px;border:2px solid #c8bfae;border-radius:8px;outline:none;background:#fff;color:#2b2b2b}
  #q:focus{border-color:#c05f3c;box-shadow:0 0 0 3px rgba(192,95,60,.15)}
  #q::placeholder{color:#a89e8e;font-size:12px}
  #clear{padding:10px 12px;font-size:13px;border:2px solid #c8bfae;background:#fff;border-radius:8px;color:#7a7264;cursor:pointer;font-weight:600}
  #count{font-size:10.5px;color:#3e5c4b;font-weight:600;padding:0 12px 6px;background:#dfe8e0}
  #wrap{flex:1;display:flex;min-height:0}
  #sidebar{width:345px;overflow-y:auto;background:#fffdf9;border-right:1px solid #e3ddd2}
  #map{flex:1}
  .daybar{display:flex;gap:5px;padding:8px;background:#efe9df;position:sticky;top:0;z-index:500;flex-wrap:wrap}
  .daybar button{flex:1 1 30%;font-size:10.5px;padding:6px 3px;border:1px solid #c8bfae;background:#fff;border-radius:6px;cursor:pointer;color:#3e5c4b;font-weight:600}
  .daybar button.on{background:#3e5c4b;color:#fff;border-color:#3e5c4b}
  .daybar button.all{flex:1 1 100%}
  .grp{padding:7px 12px;font-size:11px;font-weight:700;color:#3e5c4b;background:#f3eee5;letter-spacing:.03em}
  .item{padding:9px 12px;border-bottom:1px solid #f0ebe2;cursor:pointer}
  .item:hover{background:#f6f1e7}
  .item .n{display:flex;align-items:baseline;gap:7px}
  .item .num{display:inline-flex;align-items:center;justify-content:center;min-width:21px;height:21px;border-radius:50%;background:#c05f3c;color:#fff;font-size:11px;font-weight:700;flex:none}
  .item .t{font-size:12.5px;font-weight:600;line-height:1.3}
  .item .en{font-size:10px;color:#8a8272;margin-top:1px}
  .item .d{font-size:10.5px;color:#7a7264;margin-top:2px;line-height:1.45}
  .item .h{font-size:10.5px;color:#3e5c4b;font-weight:600;margin-top:2px}
  .item .dist{font-size:10px;color:#c05f3c;font-weight:600;margin-top:1px}
  .item.far{opacity:.75}
  .legend{padding:10px 12px;font-size:10.5px;color:#7a7264;border-top:2px solid #efe9df;background:#fffdf9;line-height:1.6}
  .legend b{color:#2b2b2b}
  .leaflet-popup-content{font-size:12px;line-height:1.55;margin:10px 12px;max-height:340px;overflow:auto}
  .leaflet-popup-content h3{margin:0 0 2px;font-size:13px;color:#3e5c4b}
  .leaflet-popup-content .en{font-size:10.5px;color:#8a8272;margin-bottom:4px}
  .leaflet-popup-content .m{color:#7a7264;font-size:11px}
  .leaflet-popup-content .hr{color:#3e5c4b;font-weight:600;font-size:11.5px;margin:4px 0}
  .leaflet-popup-content a{color:#c05f3c}
  @media(max-width:760px){
    #wrap{flex-direction:column-reverse}
    #sidebar{width:100%;height:42vh;border-right:none;border-top:1px solid #e3ddd2}
    #map{height:58vh}
  }

  .pinwrap{background:none;border:none;overflow:visible}
  .pinball{width:36px;height:36px;border-radius:50%;color:#fff;
    font:700 13px/30px -apple-system,"Noto Sans TC",sans-serif;text-align:center;
    border:3px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.45);box-sizing:border-box;
    display:flex;align-items:center;justify-content:center;cursor:pointer}

  html,body{overscroll-behavior:none;overscroll-behavior-x:none;overscroll-behavior-y:none;touch-action:pan-y}
  #map,#app{overscroll-behavior:none}
  .leaflet-container{overscroll-behavior:none;touch-action:none}
  .leaflet-grab{cursor:grab}

  .daybar{display:block;padding:7px 8px}
  .cbrow{display:flex;gap:5px;margin-bottom:5px}
  .cbrow:last-child{margin-bottom:0}
  .cb{flex:1 1 0;display:flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;
      color:#3e5c4b;background:#fff;border:1px solid #c8bfae;border-radius:6px;padding:5px 6px;
      cursor:pointer;user-select:none;white-space:nowrap;overflow:hidden}
  .cb:has(input:checked){background:#eef4ef;border-color:#3e5c4b}
  .cb input{width:13px;height:13px;accent-color:#3e5c4b;margin:0;flex:none;cursor:pointer}
  .cb .sw{width:9px;height:9px;border-radius:50%;flex:none}
  .cb b{font-weight:700}

  .filterbar{position:sticky;top:0;z-index:600;padding:7px 8px;background:#efe9df;border-bottom:1px solid #e0d8c9}
  #fbtn{width:100%;display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;
        color:#3e5c4b;background:#fff;border:1.5px solid #3e5c4b;border-radius:8px;
        padding:8px 10px;cursor:pointer}
  #fbtn .fdot{width:10px;height:10px;border-radius:50%;background:#c05f3c;flex:none}
  #fbtn #fcount{margin-left:auto;font-size:10.5px;font-weight:700;color:#7a7264;
        background:#f1ece2;border-radius:20px;padding:2px 8px}
  #fbtn .car{font-size:10px;color:#7a7264;transition:transform .18s}
  #fbtn[aria-expanded="true"] .car{transform:rotate(180deg)}
  .fpop{position:absolute;left:8px;right:8px;top:calc(100% + 4px);background:#fff;
        border:1px solid #c8bfae;border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.18);
        padding:8px;max-height:68vh;overflow-y:auto;animation:popin .14s ease-out}
  @keyframes popin{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
  .fphead{display:flex;align-items:center;justify-content:space-between;font-size:11px;
        font-weight:700;color:#3e5c4b;padding:2px 4px 7px;border-bottom:1px solid #f0ebe2;margin-bottom:5px}
  #fclose{border:none;background:#f1ece2;color:#7a7264;width:22px;height:22px;border-radius:50%;
        font-size:12px;cursor:pointer;line-height:1}
  .fpop .cb{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;
        color:#3b3b3b;background:#fff;border:none;border-radius:6px;padding:9px 6px;
        cursor:pointer;user-select:none;white-space:normal;line-height:1.3}
  .fpop .cb:hover{background:#f7f3ea}
  .fpop .cb input{width:16px;height:16px;accent-color:#3e5c4b;margin:0;flex:none;cursor:pointer}
  .fpop .cb .sw{width:10px;height:10px;border-radius:50%;flex:none}
  .fpop .cb .cnt{margin-left:auto;font-size:10px;font-weight:700;color:#8a8272;
        background:#f1ece2;border-radius:20px;padding:1px 7px;flex:none}
  .fpfoot{display:flex;gap:6px;align-items:center;margin-top:6px;padding-top:7px;border-top:1px solid #f0ebe2}
  .fpfoot .allcb{flex:1;padding:7px 4px}
  #fapply{flex:none;font-size:11.5px;font-weight:700;color:#fff;background:#3e5c4b;
        border:none;border-radius:7px;padding:9px 16px;cursor:pointer}
  #fapply:active{background:#2f4a3c}
  .fback{position:fixed;inset:0;background:rgba(20,20,20,.28);z-index:550}

  /* ===== view tabs ===== */
  .viewtabs{display:flex;gap:6px;padding:7px 10px;background:#3e5c4b;position:relative;z-index:70}
  .viewtabs .vt{flex:1;border:none;border-radius:8px;padding:9px 4px;font-size:12.5px;font-weight:700;
        background:rgba(255,255,255,.16);color:#dfe8e0;cursor:pointer}
  .viewtabs .vt.on{background:#fffdf9;color:#3e5c4b}
  .view{display:none}
  .view.on{display:flex;flex-direction:column;flex:1;min-height:0}

  /* ===== itinerary (scoped to #view-plan) ===== */
  #view-plan{overflow-y:auto;display:none;background:#f7f4ef;padding-bottom:76px}
  #view-plan.on{display:block}
  #view-plan .ithead{display:none}

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{overscroll-behavior:none;margin:0}
  body.x{font-family:-apple-system,"Noto Sans TC","Hiragino Sans",sans-serif;
       background:#f7f4ef;color:#2b2b2b;padding-bottom:76px}
  header{background:#3e5c4b;color:#fff;padding:11px 15px 9px;position:sticky;top:0;z-index:60}
  header h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.01em}
  header p{margin:3px 0 0;font-size:10.5px;opacity:.85;line-height:1.4}

  /* ---- day tabs ---- */
  .tabs{display:flex;gap:5px;padding:8px 10px;background:#efe9df;
        position:sticky;top:56px;z-index:55;border-bottom:1px solid #e0d8c9}
  .tabs button{flex:1;border:1.5px solid #c8bfae;background:#fff;border-radius:8px;
        padding:8px 4px;font-size:11.5px;font-weight:700;color:#3e5c4b;cursor:pointer;line-height:1.25}
  .tabs button small{display:block;font-size:9.5px;font-weight:600;color:#8a8272;margin-top:1px}
  .tabs button.on{background:#3e5c4b;color:#fff;border-color:#3e5c4b}
  .tabs button.on small{color:#cfe0d5}

  /* ---- progress ---- */
  .prog{padding:9px 15px 3px;display:flex;align-items:center;gap:9px}
  .bar{flex:1;height:7px;background:#e5ded1;border-radius:20px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c05f3c,#3e5c4b);
        border-radius:20px;transition:width .3s ease}
  .prog span{font-size:11px;font-weight:700;color:#3e5c4b;white-space:nowrap}

  /* ---- day meta ---- */
  .meta{margin:8px 12px 4px;padding:9px 12px;background:#fffdf9;border-left:3px solid #c05f3c;
        border-radius:0 8px 8px 0;font-size:11px;color:#6b6355;line-height:1.65}
  .meta b{color:#3e5c4b}

  /* ---- item list ---- */
  .day{display:none;padding-bottom:12px}
  .day.on{display:block}
  .item{display:flex;gap:10px;padding:11px 13px;margin:0 12px 7px;background:#fff;
        border:1px solid #e8e1d4;border-radius:9px;transition:.16s;align-items:flex-start}
  .item.done{background:#f0f5f1;border-color:#b9cdbf}
  .item.done .body{opacity:.5}
  .item.done .body .tt{text-decoration:line-through}
  .item.warn{border-left:3px solid #c0392b}
  .item.star{border-left:3px solid #d4a017}

  .chk{flex:none;width:26px;height:26px;border:2px solid #c0b7a6;border-radius:7px;
       background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
       margin-top:1px;transition:.15s}
  .chk:active{transform:scale(.9)}
  .chk svg{width:15px;height:15px;opacity:0;stroke:#fff;stroke-width:3.4;fill:none;
           stroke-linecap:round;stroke-linejoin:round;transition:.15s}
  .item.done .chk{background:#3e5c4b;border-color:#3e5c4b}
  .item.done .chk svg{opacity:1}

  .body{flex:1;min-width:0}
  .tm{font-size:10.5px;font-weight:800;color:#c05f3c;letter-spacing:.02em;margin-bottom:2px}
  .tt{font-size:13px;font-weight:700;line-height:1.35;margin-bottom:3px}
  .sub{font-size:10.8px;color:#7a7264;line-height:1.55}
  .sub em{font-style:normal;color:#3e5c4b;font-weight:600}
  .tag{display:inline-block;font-size:9.5px;font-weight:700;padding:1.5px 6px;border-radius:4px;
       margin:3px 4px 0 0;background:#f1ece2;color:#7a7264}
  .tag.w{background:#fbe4e0;color:#a93226}
  .tag.g{background:#e6efe8;color:#3e5c4b}

  .sec{margin:13px 12px 5px;font-size:10.5px;font-weight:800;color:#8a8272;
       letter-spacing:.06em;text-transform:uppercase}

  /* ---- footer bar ---- */
  .foot{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;gap:7px;
        padding:9px 12px calc(9px + env(safe-area-inset-bottom));
        background:#fffdf9;border-top:1px solid #e5ded1}
  .foot button{flex:1;border-radius:8px;font-size:11.5px;font-weight:700;padding:11px 6px;cursor:pointer;
        border:1.5px solid #c8bfae;background:#fff;color:#3e5c4b}
  .foot button.primary{background:#3e5c4b;color:#fff;border-color:#3e5c4b}
  .foot button:active{opacity:.75}
  .saved{position:fixed;left:50%;transform:translateX(-50%) translateY(14px);bottom:70px;
        background:rgba(45,45,45,.92);color:#fff;font-size:11.5px;font-weight:600;
        padding:8px 15px;border-radius:20px;opacity:0;transition:.22s;pointer-events:none;z-index:80}
  .saved.on{opacity:1;transform:translateX(-50%) translateY(0)}

  #view-plan .day{display:none;padding-bottom:12px}
  #view-plan .day.on{display:block}
  #view-plan .item{display:flex;gap:10px;padding:11px 13px;margin:0 12px 7px;background:#fff;

  #view-plan .body{flex:1;min-width:0}

    #view-plan .foot{bottom:0}
  }


  /* ---- 4-state marks ---- */
  #view-plan .item.st-done{background:#eef5f0;border-color:#a9c9b6}
  #view-plan .item.st-partial{background:#fff8e6;border-color:#e6cf94}
  #view-plan .item.st-skip{background:#f2f2f2;border-color:#cfcbc4}
  #view-plan .item.st-done .body,#view-plan .item.st-skip .body{opacity:.55}
  #view-plan .item.st-done .tt{text-decoration:line-through}
  #view-plan .item.st-skip .tt{text-decoration:line-through;text-decoration-color:#a93226}
  #view-plan .item .chk{position:relative;font-size:13px;line-height:1;font-weight:800}
  #view-plan .item .chk svg{display:none}
  #view-plan .item .chk::after{content:"";font-size:14px;line-height:1}
  #view-plan .item.st-done .chk{background:#3e5c4b;border-color:#3e5c4b;color:#fff}
  #view-plan .item.st-done .chk::after{content:"✓"}
  #view-plan .item.st-partial .chk{background:#d4a017;border-color:#d4a017;color:#fff}
  #view-plan .item.st-partial .chk::after{content:"◐"}
  #view-plan .item.st-skip .chk{background:#8a8272;border-color:#8a8272;color:#fff}
  #view-plan .item.st-skip .chk::after{content:"✕"}
  #view-plan .item:not(.st-done):not(.st-partial):not(.st-skip) .chk::after{content:""}
  /* flash on remote update */
  #view-plan .item.flash{box-shadow:0 0 0 2px #c05f3c inset;transition:box-shadow .2s}

  .syncbar{position:fixed;left:0;right:0;bottom:0;z-index:80;display:flex;align-items:center;gap:8px;
        padding:7px 13px calc(7px + env(safe-area-inset-bottom));
        background:#fffdf9;border-top:1px solid #e5ded1;font-size:10.5px;font-weight:600;color:#7a7264}
  #syncState{display:flex;align-items:center;gap:5px}
  #syncState::before{content:"";width:7px;height:7px;border-radius:50%;background:#a8a096;flex:none}
  #syncState.ok::before{background:#3e9c5f}
  #syncState.err::before{background:#c0392b}
  #syncState.wait::before{background:#d4a017}
  #syncWho{margin-left:auto;color:#b3a99a;font-weight:600}

        box-shadow:0 5px 16px rgba(0,0,0,.28);cursor:pointer}
  #fab:active{transform:scale(.94)}

  .sheetFoot button{flex:1;border-radius:9px;font-size:13px;font-weight:800;padding:12px 8px;cursor:pointer;border:none}
  .sheetFoot .primary{background:#3e5c4b;color:#fff}
  .sheetFoot .danger{background:#fbe4e0;color:#a93226;flex:0 0 88px}

  #fab{width:54px;height:54px;border-radius:50%;border:none;background:#c05f3c;color:#fff;
        font-size:29px;line-height:1;font-weight:400;box-shadow:0 5px 16px rgba(0,0,0,.28);cursor:pointer;
        transition:transform .18s}

  .bub{display:flex;align-items:center;gap:7px;border:none;border-radius:26px;padding:9px 14px 9px 11px;
        background:#fffdf9;color:#3e5c4b;font-size:12.5px;font-weight:800;cursor:pointer;
        box-shadow:0 4px 14px rgba(0,0,0,.2);opacity:0;transform:translateY(10px) scale(.94);
        pointer-events:none;transition:.16s;white-space:nowrap}
  .bub .ic{font-size:15px;line-height:1}
  #fabWrap.open .bub{opacity:1;transform:none;pointer-events:auto}

  #fabWrap.open .bub:nth-child(2){transition-delay:.02s}
  .bub:active{background:#f1ece2}

  /* ===== detail sheet ===== */
  .sheet.detail{max-height:92vh}
  #detBody{padding:12px 15px 6px}

  .detPlace{border:1px solid #e5ded1;border-radius:9px;padding:10px 12px;margin-bottom:11px;background:#fffdf9}

  .detPlace .pa{font-size:11px;color:#7a7264;line-height:1.5}

  .detSec{font-size:10.5px;font-weight:800;color:#8a8272;letter-spacing:.05em;margin:13px 0 7px;text-transform:uppercase}
  .attList{display:flex;flex-direction:column;gap:8px}

  .att .x{border:none;background:#f1ece2;color:#a93226;width:24px;height:24px;border-radius:50%;

  .empty{font-size:11.5px;color:#a89e8e;padding:9px 2px}
  .sheetFoot .attach{background:#f1ece2;color:#3e5c4b;flex:1.1}

  header p{font-size:11.5px;color:#8a8272;margin:3px 0 0}

  <input id="camPick" type="file" accept="image/*" capture="environment" hidden>

<div class="saved" id="toast">✓ 已記錄</div>
    <div class="syncbar"><span id="syncState">連線中…</span><span id="syncWho"></span></div>
  </div><!-- /view-plan -->

</div>

// classify each point into a type key
function ptype(p){
  if(p.id>=140 && p.id<200) return 'hobbyoff';
  if(p.id>=120 && p.id<140) return 'hardoff';
  if(p.id>=80 && p.id<120) return 'sushi';
  if(p.id>=60 && p.id<80) return 'mandarake';
  const n=(p.n||'')+' '+(p.en||'');
  if(n.indexOf('Step Sports')>=0 || (p.t||'').indexOf('運動')>=0) return 'sport';
  if(n.indexOf('Book Off')>=0 || n.indexOf('BOOKOFF')>=0) return 'bookoff';
  if(n.indexOf('Hobby Off')>=0) return 'hobbyoff';
  if(n.indexOf('Hard Off')>=0) return 'hardoff';
  if(n.indexOf('羅針盤')>=0 || n.indexOf('Lashinbang')>=0 || n.indexOf('Animate')>=0) return 'anime';
  return 'trip';
}

function activeTypes(){ return new Set(TYPES.filter(c=>c.checked).map(c=>c.value)); }
function matches(p,q){
  if(!q) return true;
  const hay=[p.n,p.en,p.a,p.d,p.h,p.t,p.dist||""].join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(t=>hay.includes(t));
}
function visible(p){ return activeTypes().has(p.type) && matches(p,curQ); }

function render(){
  listEl.innerHTML="";

  let shown=0;

    const arr=POINTS.filter(p=>p.g===gg && act.has(p.type) && matches(p,curQ)).sort((a,b)=>a.id-b.id);

      d.onclick=()=>focusPoint(p.id);listEl.appendChild(d);

  if(mand.length){
    const h=document.createElement('div');h.className='grp';h.textContent=GROUP_LABEL.mandarake+`（${mand.length}）`;listEl.appendChild(h);
    mand.forEach(p=>{
      shown++;

      d.innerHTML=`<div class="n"><span class="num" style="background:${p.c}">${p.id}</span><span class="t">${p.n}</span></div>
        <div class="en">${p.en}</div><div class="d">${p.t}</div><div class="h">🕐 ${p.h}</div>

    m.setOpacity(vis?1:0);
    if(vis){ if(!map.hasLayer(m)) m.addTo(map); } else { if(map.hasLayer(m)) map.removeLayer(m); }
  });
}

// ---- Block Chrome overscroll navigation (drag-map triggering back gesture) ----
(function(){
  // stop horizontal overscroll at page level
  document.documentElement.style.overscrollBehavior='none';
  document.body.style.overscrollBehavior='none';
  // prevent two-finger horizontal swipe nav on trackpads / touchpads
  let sx=0, sy=0, tracking=false;
  window.addEventListener('wheel', function(e){
    if(Math.abs(e.deltaX) > Math.abs(e.deltaY)*1.2) { e.preventDefault(); }
  }, {passive:false});
  // touch: block edge-swipe back
  window.addEventListener('touchstart', function(e){
    if(e.touches.length===1){ sx=e.touches[0].clientX; sy=e.touches[0].clientY; tracking=true; }
  }, {passive:true});
  window.addEventListener('touchmove', function(e){
    if(!tracking || e.touches.length!==1) return;
    const dx=e.touches[0].clientX-sx, dy=e.touches[0].clientY-sy;
    // edge swipe from left/right 30px = browser back/forward
    if(Math.abs(dx)>10 && Math.abs(dx)>Math.abs(dy)*1.5){
      const w=window.innerWidth, x=e.touches[0].clientX;
      if(x<40 || x>w-40){ e.preventDefault(); }
    }
  }, {passive:false});
  window.addEventListener('touchend', function(){ tracking=false; }, {passive:true});
  // push a history guard so a stray back doesn't leave the page
  try{
    history.pushState({map:1}, '');
    window.addEventListener('popstate', function(){
      history.pushState({map:1}, '');
    });
  }catch(err){}
})();

(function(){

  const TOKEN_KEY='trip_token';
  const API='/api';
  let TOKEN=localStorage.getItem(TOKEN_KEY)||'';
  if(!TOKEN){ location.replace('/login'+location.search); }
  let ME=null, TRIP=null, ROLE='viewer', CAN_EDIT=false;
  function authHeaders(extra){ return Object.assign({'Authorization':'Bearer '+TOKEN}, extra||{}); }
  async function apiGet(path){
    const r=await fetch(API+path,{cache:'no-store',headers:authHeaders()});
    if(r.status===401){ location.href='/login'+location.search; throw new Error('auth'); }
    return r.json();
  }
  async function apiPost(path,body){
    const r=await fetch(API+path,{method:'POST',cache:'no-store',
      headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify(body)});
    if(r.status===401){ location.href='/login'+location.search; throw new Error('auth'); }
    return r.json();
  }
  const CYCLE=['','done','partial','skip'];
  const KIND_ICON={food:'🍜',sight:'🏯',shop:'🛍',move:'🚄',run:'🏃',rest:'😴',
                   gear:'🎒',warn:'⚠️',star:'⭐',event:'🎪',stay:'🏨',other:'📌'};
  const DAY_LABEL={};
  let DAYS=['d1','d2','d3'];
  function rebuildDays(n){
    DAYS=[]; for(let i=1;i<=n;i++) DAYS.push('d'+i);
    DAYS.forEach((d,i)=>{ DAY_LABEL[d]='第'+(i+1)+'日'; });
  }
  rebuildDays(3);

  let items=[], marks={}, pois=[], photos=[], rev=0;
  let curDay='d1';
  let editingId=null;      // null = new item
  let pendingPhoto=null;   // {dataUrl, mime}

  const syncEl=document.getElementById('syncState');
  const whoEl=document.getElementById('syncWho');
  const daylist=document.getElementById('daylist');

  function setSync(kind,txt){ syncEl.className=kind||''; syncEl.textContent=txt; }
  function esc(v){ return String(v==null?'':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function poiById(id){ return pois.find(p=>p.id===id)||null; }

  // ---------------- render ----------------
  function paint(){
    daylist.innerHTML='';
    DAYS.forEach(day=>{
      const sec=document.createElement('section');
      sec.className='day'+(day===curDay?' on':'');
      sec.id=day;
      const arr=items.filter(it=>it.day===day).sort((a,b)=>(a.sort-b.sort)||a.id.localeCompare(b.id));
      const meta=document.createElement('div'); meta.className='meta';
      const st=counts(arr);
      meta.innerHTML='<b>'+DAY_LABEL[day]+'</b> · '+arr.length+' 項'+
        (st.done?' · ✓'+st.done:'')+(st.partial?' · ◐'+st.partial:'')+(st.skip?' · ✕'+st.skip:'');
      sec.appendChild(meta);
      arr.forEach(it=>sec.appendChild(row(it)));
      daylist.appendChild(sec);
    });
    updateProgress();
  }

  function counts(arr){
    const c={done:0,partial:0,skip:0};
    arr.forEach(it=>{ const m=marks[it.id]||''; if(c[m]!==undefined) c[m]++; });
    return c;
  }

  function row(it){
    const el=document.createElement('div');

        '<div class="ttRow"><div class="tt">'+esc(it.title)+'</div>'+
          '<div class="tools">'+
            '<button data-act="up" title="上移">↑</button>'+
            '<button data-act="down" title="下移">↓</button>'+

      const d=await apiGet('/state?trip='+encodeURIComponent(TRIP));
      if(d.rev!==rev){
        rev=d.rev;
        const b=await apiGet('/bootstrap?trip='+encodeURIComponent(TRIP));
        const old={...marks};
        items=b.items||[]; marks=b.marks||{}; pois=b.pois||[]; photos=b.photos||[];
        rev=b.rev;
        paint();
        Object.keys(marks).forEach(k=>{
          if(old[k]!==marks[k]) flash(k);
        });
        Object.keys(old).forEach(k=>{ if(!(k in marks)) flash(k); });
        whoEl.textContent='已同步更新';
        setTimeout(()=>{ whoEl.textContent=''; },2400);
      }
      setSync('ok','已連線 · 協作中');
    }catch(e){ setSync('err','連線失敗'); }
  }
  function flash(id){
    const el=daylist.querySelector('.item[data-id="'+id+'"]');
    if(!el) return;
    el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),900);
  }

  async function post(path, body){
    setSync('wait','儲存中…');
    try{
      const d=await apiPost(path.replace(/^\/api/,''), Object.assign({trip:TRIP},body));
      if(!d.ok) throw new Error(d.error||'fail');
      if(d.rev) rev=d.rev;
      setSync('ok','已連線 · 協作中');
      return d;
    }catch(e){
      setSync('err','儲存失敗');
      throw e;
    }
  }

  // ---------------- checkbox cycle ----------------
  async function cycle(id,el){
    const cur=marks[id]||'';
    const next=CYCLE[(CYCLE.indexOf(cur)+1)%CYCLE.length];
    if(next) marks[id]=next; else delete marks[id];
    el.classList.remove('st-done','st-partial','st-skip');
    if(next) el.classList.add('st-'+next);
    updateProgress();
    try{ await post(API+'/set',{item:id,status:next}); }
    catch(e){ /* keep optimistic, poll will reconcile */ }
  }

  // ---------------- move / delete ----------------
  async function moveItem(id,dir){
    try{ await post(API+'/item/move',{id:id,dir:dir}); await bootstrap(); }
    catch(e){}
  }

  // ---------------- sheet ----------------
  const sheet=document.getElementById('sheet'), back=document.getElementById('sheetBack');
  const fDay=document.getElementById('fDay'), fTime=document.getElementById('fTime'),
        fTitle=document.getElementById('fTitle'), fSub=document.getElementById('fSub'),
        fKind=document.getElementById('fKind'), fPlace=document.getElementById('fPlace');
  const btnDel=document.getElementById('btnDelete'), photoPrev=document.getElementById('photoPreview'),
        photoImg=document.getElementById('photoImg'), sheetTitle=document.getElementById('sheetTitle');

  function fillPlaceSelect(){
    const keep=fPlace.value;
    fPlace.innerHTML='<option value="">（不連地圖）</option>';
    pois.forEach(p=>{
      const o=document.createElement('option');
      o.value=p.id; o.textContent=p.name+(p.addr?('　'+p.addr.slice(0,18)):'');
      fPlace.appendChild(o);
    });
    if(keep) fPlace.value=keep;
  }

  function openSheet(it, photoData){
    editingId=it?it.id:null;
    sheetTitle.textContent=it?'編輯行程':'加新行程';
    fDay.value=it?it.day:curDay;
    fTime.value=it?it.time:'';
    fTitle.value=it?it.title:'';
    fSub.value=it?it.sub:'';
    fKind.value=it?it.kind||'other':'other';
    fPlace.value=it&&it.place_id?it.place_id:'';
    btnDel.hidden=!it;
    if(photoData){
      pendingPhoto=photoData;
      photoImg.src=photoData.dataUrl; photoPrev.hidden=false;
    }else{
      pendingPhoto=null; photoPrev.hidden=true; photoImg.src='';
    }
    back.hidden=false; sheet.hidden=false;
    setTimeout(()=>{ if(!it) fTitle.focus(); },120);
  }
  function closeSheet(){
    back.hidden=true; sheet.hidden=true; pendingPhoto=null; editingId=null;
  }
  document.getElementById('sheetX').addEventListener('click',closeSheet);
  back.addEventListener('click',closeSheet);

  document.getElementById('btnSave').addEventListener('click',async()=>{
    const title=fTitle.value.trim();
    if(!title){ fTitle.focus(); fTitle.style.borderColor='#c0392b'; return; }
    const body={
      day:fDay.value, time:fTime.value.trim(), title:title,
      sub:fSub.value.trim(), kind:fKind.value, place_id:fPlace.value||null
    };
    try{
      if(pendingPhoto){
        body.image=pendingPhoto.dataUrl; body.mime=pendingPhoto.mime;
        if(editingId) body.item_id=editingId;
        await post(API+'/photo/commit', body);
      }else{
        if(editingId) body.id=editingId;
        await post(API+'/item', body);
      }
      closeSheet();
      await bootstrap();
      showDay(body.day);
    }catch(e){ alert('儲存失敗，請再試'); }
  });

  btnDel.addEventListener('click',async()=>{
    if(!editingId) return;
    if(!confirm('刪除呢一項？')) return;
    try{ await post(API+'/item/delete',{id:editingId}); closeSheet(); await bootstrap(); }
    catch(e){}
  });

  // ================= item detail =================
  const detail=document.getElementById('detail'), detBack=document.getElementById('detBack'),
        detBody=document.getElementById('detBody'), detTitle=document.getElementById('detTitle'),
        detFilePick=document.getElementById('detFilePick');
  let detItem=null;

  function openDetail(it){
    detItem=it;
    detTitle.textContent='項目詳情';
    const place=poiById(it.place_id);
    const atts=photos.filter(ph=>ph.item_id===it.id);
    const st=marks[it.id]||'';
    const stLabel={done:'✓ 完成',partial:'◐ 部分',skip:'✕ 跳過'}[st]||'未做';
    const kindName={food:'食',sight:'景點',shop:'購物',move:'交通',run:'跑步',rest:'休息',
                    gear:'裝備',warn:'重要',star:'重點',event:'活動',stay:'住宿',other:'其他'}[it.kind]||'';

    let html='';
    const hero = atts[0] || (it.photo?{file:it.photo}:null);
    if(hero) html+='<div class="detHero"><img src="/api/photo/'+esc(hero.file)+'" alt=""></div>';
    html+='<div class="detTime">'+esc(it.time||'')+'</div>';
    html+='<div class="detTitle">'+esc(it.title)+'</div>';
    html+='<div class="detMeta">';
    if(kindName) html+='<span>'+esc(kindName)+'</span>';
    html+='<span class="k">'+stLabel+'</span>';
    html+='<span>'+esc(DAY_LABEL[it.day]||it.day)+'</span>';
    if(atts.length) html+='<span>📷 '+atts.length+' 張</span>';
    html+='</div>';
    if(it.sub) html+='<div class="detSub">'+esc(it.sub)+'</div>';
    if(place){
      html+='<div class="detPlace"><div class="pn">📍 '+esc(place.name)+'</div>'+
            '<div class="pa">'+esc(place.addr||'')+(place.hours?('｜'+esc(place.hours)):'')+'</div>'+
            (place.lat?('<a href="https://www.google.com/maps/dir/?api=1&destination='+place.lat+','+place.lng+'" target="_blank">→ Google Maps 導航</a>'):'')+
            '</div>';
    }
    html+='<div class="detSec">相片／收據／參考資料 ('+atts.length+')</div>';
    if(atts.length){
      html+='<div class="attList">';
      atts.forEach(ph=>{
        html+='<div class="att" data-ph="'+esc(ph.id)+'" data-file="'+esc(ph.file)+'">'+
              '<img src="/api/photo/'+esc(ph.file)+'" alt="" loading="lazy">'+
              '<div class="ai"><div class="an">'+esc(ph.caption||'相片')+'</div>'+
              '<div class="ad">'+new Date((ph.created||0)*1000).toLocaleString('zh-HK',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})+'</div></div>'+
              '<button class="x" data-del="'+esc(ph.id)+'">✕</button></div>';
      });
      html+='</div>';
    }else{
      html+='<div class="empty">仲未有相片。撳下面「📷 加相／收據」上載收據、餐牌或者現場相。</div>';
    }
    detBody.innerHTML=html;

    detBody.querySelectorAll('.att').forEach(a=>{
      a.addEventListener('click',e=>{
        if(e.target.closest('[data-del]')) return;
        window.open('/api/photo/'+a.dataset.file,'_blank');
      });
    });
    detBody.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click',async e=>{
        e.stopPropagation();
        if(!confirm('刪除呢張相？')) return;
        try{
          await post(API+'/photo/delete',{photo_id:btn.dataset.del});
          await bootstrap();
          const fresh=items.find(x=>x.id===detItem.id);
          if(fresh) openDetail(fresh);
        }catch(err){}
      });
    });

    detBack.hidden=false; detail.hidden=false;
  }
  function closeDetail(){ detail.hidden=true; detBack.hidden=true; detItem=null; }
  document.getElementById('detX').addEventListener('click',closeDetail);
  detBack.addEventListener('click',closeDetail);
  document.getElementById('detEdit').addEventListener('click',()=>{
    const it=detItem; closeDetail(); if(it) openSheet(it);
  });
  document.getElementById('detAttach').addEventListener('click',()=>detFilePick.click());
  detFilePick.addEventListener('change',async e=>{
    const files=[...(e.target.files||[])]; detFilePick.value='';
    if(!files.length||!detItem) return;
    const targetId=detItem.id;
    const ov=document.createElement('div');
    ov.className='analyzing';
    ov.innerHTML='<div class="sp"></div><p>AI 睇緊相片…</p><small>共 '+files.length+' 張</small>';
    document.body.appendChild(ov);
    try{
      for(const f of files){
        const dataUrl=await new Promise(res=>{const rd=new FileReader();rd.onload=()=>res(rd.result);rd.readAsDataURL(f);});
        let sug=null;
        try{
          const r=await fetch(API+'/photo/analyze',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({trip:TRIP,image:dataUrl,mime:f.type})});
          const d=await r.json(); if(d.ok) sug=d.suggestion;
        }catch(err){}
        await post(API+'/photo/attach',{
          item_id:targetId, image:dataUrl, mime:f.type,
          caption:(sug&&sug.title)||f.name||'相片', raw:(sug?JSON.stringify(sug):'')
        });
      }
    }catch(err){}
    ov.remove();
    await bootstrap();
    const fresh=items.find(x=>x.id===targetId);
    if(fresh) openDetail(fresh);
  });

  // ================= fab: camera / pick =================
  const fabWrap=document.getElementById('fabWrap');
  const filePick=document.getElementById('filePick');
  const camPick=document.getElementById('camPick');
  document.getElementById('fab').addEventListener('click',e=>{
    e.stopPropagation();
    fabWrap.classList.toggle('open');
    document.getElementById('fab').classList.toggle('open');
  });
  document.addEventListener('click',e=>{
    if(!e.target.closest('#fabWrap')){ fabWrap.classList.remove('open'); document.getElementById('fab').classList.remove('open'); }
  });
  document.getElementById('fabCamera').addEventListener('click',()=>{
    fabWrap.classList.remove('open'); document.getElementById('fab').classList.remove('open');
    camPick.click();
  });
  document.getElementById('fabPick').addEventListener('click',()=>{
    fabWrap.classList.remove('open'); document.getElementById('fab').classList.remove('open');
    filePick.click();
  });

  async function handlePhotoInput(e){
    const f=e.target.files&&e.target.files[0];
    e.target.value='';
    if(!f) return;
    if(!/^image\//.test(f.type)){ alert('請揀相片檔'); return; }
    const dataUrl=await new Promise(res=>{
      const rd=new FileReader(); rd.onload=()=>res(rd.result); rd.readAsDataURL(f);
    });
    const ov=document.createElement('div');
    ov.className='analyzing';
    ov.innerHTML='<div class="sp"></div><p>AI 睇緊張相…</p><small>認緊食咩／邊間鋪／邊個位置</small>';
    document.body.appendChild(ov);
    let sug=null;
    try{
      const r=await fetch(API+'/photo/analyze',{method:'POST',
        headers:authHeaders({'Content-Type':'application/json'}),
        body:JSON.stringify({trip:TRIP,image:dataUrl,mime:f.type})});
      const d=await r.json();
      if(d.ok) sug=d.suggestion;
    }catch(err){}
    ov.remove();
    openSheet(null,{dataUrl:dataUrl,mime:f.type});
    if(sug){
      fTitle.value=sug.title||'';
      fSub.value=sug.sub||'';
      if(sug.kind) fKind.value=sug.kind;
      if(sug.time_guess) fTime.value=sug.time_guess;
      const nm=(sug.shop_name||'').toLowerCase();
      if(nm){
        const hit=pois.find(p=>(p.name_en||'').toLowerCase().includes(nm)||
                                (p.name||'').toLowerCase().includes(nm));
        if(hit) fPlace.value=hit.id;
      }
      fTitle.style.borderColor='#3e5c4b';
      setTimeout(()=>{ fTitle.style.borderColor=''; },1600);
    }
  }
  filePick.addEventListener('change',handlePhotoInput);
  camPick.addEventListener('change',handlePhotoInput);

  // ---------------- misc ----------------
  document.querySelectorAll('#view-plan .tabs button').forEach(b=>{
    b.addEventListener('click',()=>showDay(b.dataset.day));
  });

  // prevent edge-swipe back
  document.documentElement.style.overscrollBehavior='none';
  document.body.style.overscrollBehavior='none';
  let sx=0,sy=0,tr=false;
  window.addEventListener('touchstart',e=>{ if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY;tr=true;} },{passive:true});
  window.addEventListener('touchmove',e=>{
    if(!tr||e.touches.length!==1) return;
    const dx=e.touches[0].clientX-sx, dy=e.touches[0].clientY-sy;
    if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.5){
      const w=window.innerWidth,x=e.touches[0].clientX;
      if(x<40||x>w-40) e.preventDefault();
    }
  },{passive:false});
  window.addEventListener('touchend',()=>{tr=false;},{passive:true});

  // ---------------- account / trip switcher UI ----------------
  function el(tag, attrs, html){
    const n=document.createElement(tag);
    Object.entries(attrs||{}).forEach(([k,v])=>n.setAttribute(k,v));
    if(html!=null) n.innerHTML=html;
    return n;
  }

  function overlay(title){
    const back=el('div',{class:'sheetback'}); back.id='ovBack';
    const box=el('div',{class:'sheet'}); box.id='ovBox';
    box.appendChild(el('div',{class:'sheetHead'},
      '<span id="ovTitle">'+title+'</span><button type="button" id="ovX">✕</button>'));
    box.appendChild(el('div',{class:'sheetBody',id:'ovBody'}));
    document.body.appendChild(back); document.body.appendChild(box);
    const close=()=>{ back.remove(); box.remove(); };
    back.onclick=close; box.querySelector('#ovX').onclick=close;
    return {box, body:box.querySelector('#ovBody'), close};
  }

  async function openTripList(){
    const o=overlay('我嘅旅程');
    o.body.innerHTML='<p class="muted">載入中…</p>';
    const d=await apiGet('/trips');
    o.body.innerHTML='';
    if(!d.trips||!d.trips.length) o.body.appendChild(el('p',{class:'empty'},'仲未有旅程，撳下面「＋ 新旅程」'));
    (d.trips||[]).forEach(t=>{
      const row=el('div',{class:'trow'});
      row.innerHTML='<div><b>'+t.title+'</b><small>'+(t.start_date||'')+(t.end_date?' – '+t.end_date:'')+
        ' · '+t.days+' 日 · '+t.items+' 項</small></div><span class="rchip r-'+t.role+'">'+t.role+'</span>';
      row.onclick=()=>{ location.href='/?trip='+encodeURIComponent(t.id); };
      o.body.appendChild(row);
    });
    const nb=el('button',{class:'primary wide',type:'button'},'＋ 新旅程');
    nb.onclick=()=>{ o.close(); openNewTrip(); };
    o.body.appendChild(nb);
  }

  function openNewTrip(){
    const o=overlay('新旅程');
    o.body.innerHTML=`
      <label class="fl">旅程名</label>
      <input id="ntTitle" type="text" placeholder="例：2027 東京馬拉松">
      <div class="row2">
        <div><label class="fl">開始</label><input id="ntStart" type="date"></div>
        <div><label class="fl">結束</label><input id="ntEnd" type="date"></div>
      </div>
      <label class="fl">日數</label>
      <input id="ntDays" type="number" min="1" max="30" value="3">
      <div class="err" id="ntErr"></div>
      <button class="primary wide" id="ntGo" type="button">建立</button>`;
    o.body.querySelector('#ntGo').onclick=async()=>{
      const title=o.body.querySelector('#ntTitle').value.trim();
      const days=parseInt(o.body.querySelector('#ntDays').value||'3',10);
      if(!title){ o.body.querySelector('#ntErr').textContent='要填旅程名'; return; }
      const d=await apiPost('/trips',{title,days,
        start_date:o.body.querySelector('#ntStart').value||null,
        end_date:o.body.querySelector('#ntEnd').value||null});
      if(!d.ok){ o.body.querySelector('#ntErr').textContent=d.error||'建立失敗'; return; }
      location.href='/?trip='+encodeURIComponent(d.trip_id);
    };
  }

  async function openAccount(){
    const o=overlay('帳戶');
    o.body.innerHTML='<p class="muted">'+(ME?((ME.name||'')+'<br><small>'+ME.email+'</small>'):'')+'</p>';
    if(ROLE==='owner' && TRIP){
      const share=el('button',{class:'wide',type:'button'},'🔗 建立／重設唯讀分享連結');
      share.onclick=async()=>{
        const d=await apiPost('/trips/share',{trip_id:TRIP,role:'viewer'});
        if(d.ok){
          const url=location.origin+'/?t='+d.share_token;
          o.body.querySelector('#shareOut').value=url;
          try{ await navigator.clipboard.writeText(url); }catch(e){}
        }
      };
      o.body.appendChild(share);
      o.body.appendChild(el('input',{id:'shareOut',readonly:'readonly',placeholder:'分享連結會喺呢度出現'}));
      const inv=el('div',{class:'invrow'});
      inv.innerHTML='<input id="invEmail" type="email" placeholder="invite email"><select id="invRole">'+
        '<option value="editor">可編輯</option><option value="viewer">唯讀</option></select>'+
        '<button type="button" id="invGo">邀請</button>';
      o.body.appendChild(el('p',{class:'fl'},'邀請協作者'));
      o.body.appendChild(inv);
      inv.querySelector('#invGo').onclick=async()=>{
        const email=inv.querySelector('#invEmail').value.trim();
        const role=inv.querySelector('#invRole').value;
        const d=await apiPost('/trips/invite',{trip_id:TRIP,email,role});
        if(d.ok){ inv.querySelector('#invEmail').value=''; inv.querySelector('#invGo').textContent='已加入 ✓'; }
      };
      const mem=await apiGet('/trips/members?trip='+encodeURIComponent(TRIP));
      const list=el('div',{class:'memlist'});
      if(mem.ok){
        if(mem.owner) list.appendChild(el('div',{class:'mline'},'<b>'+(mem.owner.name||mem.owner.email)+'</b> <span class="rchip r-owner">owner</span>'));
        (mem.members||[]).forEach(m=>{
          list.appendChild(el('div',{class:'mline'},'<b>'+(m.name||m.email)+'</b> <span class="rchip r-'+m.role+'">'+m.role+'</span>'));
        });
        (mem.invites||[]).forEach(m=>{
          list.appendChild(el('div',{class:'mline'},'<i>'+m.email+'</i> <span class="rchip">待註冊 · '+m.role+'</span>'));
        });
      }
      o.body.appendChild(el('p',{class:'fl'},'成員'));
      o.body.appendChild(list);
    }
    const out=el('button',{class:'wide ghost',type:'button'},'登出');
    out.onclick=async()=>{
      await apiPost('/logout',{});
      localStorage.removeItem(TOKEN_KEY); localStorage.removeItem('trip_user');
      location.href='/login';
    };
    o.body.appendChild(out);
  }

  document.getElementById('tripSwitch').onclick=openTripList;
  document.getElementById('userBtn').onclick=openAccount;

  // ---------------- boot ----------------
  (async function boot(){
    setSync('wait','連線中…');
    if(!TOKEN){ location.href='/login'+location.search; return; }
    try{ const m=await apiGet('/me'); ME=m.user; }
    catch(e){ return; }

    const params=new URLSearchParams(location.search);
    const shareTok=params.get('t');
    if(shareTok){
      const j=await apiGet('/join?t='+encodeURIComponent(shareTok));
      if(j.ok && j.trip_id){ location.href='/?trip='+encodeURIComponent(j.trip_id); return; }
    }
    let tid=params.get('trip');
    if(!tid){
      const d=await apiGet('/trips');
      if(d.trips && d.trips.length){
        const last=localStorage.getItem('trip_last');
        tid=(last && d.trips.some(t=>t.id===last)) ? last : d.trips[0].id;
      } else { location.href='/?new=1'; return; }
      history.replaceState(null,'','/?trip='+encodeURIComponent(tid));
    }
    localStorage.setItem('trip_last', tid);
    TRIP=tid;
    const ok=await bootstrap();
    if(ok) showDay(DAYS[0]);
    setInterval(()=>{ if(!document.hidden && TRIP) pull(); },3000);
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden && TRIP) pull(); });
    if(params.get('new')==='1') openNewTrip();
  })();
})();

</script>
</body>
